# Per-repo half of .github/workflows/code-review.yml; parsed by the agent-code-review-setup installer.
# The read-along work ships as stacked PRs: every rebase of a lower PR re-reviews the ones
# above it, so the default of 5 rounds is spent on diffs already read before a stack of three
# lands. 12 leaves each member headroom for its own fix rounds; it is still a cap.
MAX_REVIEW_ROUNDS=12
